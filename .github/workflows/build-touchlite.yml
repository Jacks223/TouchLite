name: Build TouchLite from ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - 'TouchLite-source.zip'
      - '.github/workflows/build-touchlite.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract source ZIP
        run: unzip -q TouchLite-source.zip -d extracted
      - name: Build mod
        working-directory: extracted/TouchLite
        run: chmod +x gradlew && ./gradlew --no-daemon build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TouchLite-1.20.1-Fabric
          path: extracted/TouchLite/build/libs/*.jar
